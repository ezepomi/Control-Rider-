<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Rider Pro | Finanzas Rider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-yellow: #f3ff00;
            --cyber-black: #000000;
            --cyber-gray: #111111;
        }

        body {
            background-color: var(--cyber-black);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        .font-cyber { font-family: 'Orbitron', sans-serif; }

        .btn-quick {
            height: 62px;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .btn-quick:active { transform: scale(0.96); filter: brightness(1.3); }

        input {
            background: var(--cyber-gray) !important;
            border: 1px solid #333 !important;
            color: var(--neon-cyan) !important;
            text-align: center;
            font-size: 1.25rem;
            height: 60px;
            border-radius: 12px;
            outline: none;
        }
        
        input:focus { border-color: var(--neon-cyan) !important; }

        .card {
            background: rgba(15, 15, 15, 0.9);
            border-radius: 16px;
            padding: 1.25rem;
            border: 1px solid #222;
        }

        .summary-card {
            background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
            border: 1px solid #333;
        }

        /* Ocultar flechas de inputs numéricos */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .history-item {
            border-left: 4px solid var(--neon-cyan);
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-32">

    <!-- Header -->
    <header class="text-center mb-6 pt-4">
        <h1 class="font-cyber text-2xl text-cyan-400 tracking-tighter uppercase">Cyber-Rider <span class="text-white">Account</span></h1>
        <p id="headerDate" class="text-xs uppercase tracking-[0.2em] text-gray-500 mt-1 font-bold"></p>
    </header>

    <!-- Resumenes Agregados (Mes / Semana) -->
    <section class="grid grid-cols-2 gap-3 mb-6">
        <div class="summary-card p-3 rounded-xl text-center">
            <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Este Mes</p>
            <p id="monthlyTotal" class="text-xl font-cyber text-green-400">$0</p>
        </div>
        <div class="summary-card p-3 rounded-xl text-center">
            <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Esta Semana</p>
            <p id="weeklyTotal" class="text-xl font-cyber text-cyan-400">$0</p>
        </div>
    </section>

    <!-- Formulario de Entrada -->
    <main class="space-y-4">
        
        <div class="card border-gray-800">
            <label class="block text-[10px] uppercase mb-2 text-gray-500 font-bold tracking-widest">Fecha del Trabajo</label>
            <input type="date" id="regDate" class="w-full px-4 text-sm uppercase">
        </div>

        <!-- Ingresos App -->
        <div class="card border-cyan-900/30">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] uppercase mb-1 text-gray-500 font-bold">Base ($)</label>
                    <input type="number" id="baseEarnings" placeholder="0" class="w-full">
                </div>
                <div>
                    <label class="block text-[10px] uppercase mb-1 text-gray-500 font-bold">Propina App ($)</label>
                    <input type="number" id="onlineTips" placeholder="0" class="w-full">
                </div>
            </div>
        </div>

        <!-- Efectivo Recolectado (COBROS DE PEDIDOS) -->
        <div class="card border-yellow-900/30">
            <label class="block text-[10px] uppercase mb-1 text-yellow-600 font-bold">Efectivo Recolectado (Cobros)</label>
            <p class="text-[9px] text-gray-600 mb-2 uppercase">Dinero que tenés en mano que NO es tuyo</p>
            <input type="number" id="cashCollected" placeholder="0" class="w-full !text-yellow-500 !border-yellow-900/50">
        </div>

        <!-- Propina Efectivo -->
        <div class="card border-green-900/20">
            <label class="block text-[10px] uppercase mb-2 text-green-600 font-bold">Propina en Efectivo (Tuyo)</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="addQuick('cashTips', 200)" class="btn-quick rounded-xl bg-gray-900 text-green-400 border border-green-900/40">+$200</button>
                <button onclick="addQuick('cashTips', 500)" class="btn-quick rounded-xl bg-gray-900 text-green-400 border border-green-900/40">+$500</button>
                <button onclick="addQuick('cashTips', 1000)" class="btn-quick rounded-xl bg-gray-900 text-green-400 border border-green-900/40">+$1k</button>
            </div>
            <input type="number" id="cashTips" placeholder="0" class="w-full mt-3 !text-green-400">
        </div>

        <!-- Gasto Nafta -->
        <div class="card border-red-900/20">
            <label class="block text-[10px] uppercase mb-1 text-red-500 font-bold">Gasto Nafta ($)</label>
            <input type="number" id="gasExpense" placeholder="0" class="w-full !text-red-500">
        </div>

        <!-- Cálculos en Vivo -->
        <div class="grid grid-cols-2 gap-3">
            <div class="card !bg-cyan-500/5 border-cyan-500/20 text-center">
                <span class="block text-[9px] text-gray-400 uppercase font-bold">Depósito Banco</span>
                <span id="bankDeposit" class="text-xl font-cyber text-cyan-400">$0</span>
            </div>
            <div class="card !bg-green-500/5 border-green-500/20 text-center">
                <span class="block text-[9px] text-gray-400 uppercase font-bold">Ganancia Neta</span>
                <span id="liveNet" class="text-xl font-cyber text-green-400">$0</span>
            </div>
        </div>

        <button onclick="saveRecord()" class="w-full btn-quick rounded-2xl bg-green-500 text-black font-cyber text-lg shadow-lg shadow-green-500/30">
            REGISTRAR JORNADA
        </button>
    </main>

    <!-- Historial -->
    <section class="mt-10">
        <h3 class="text-[10px] uppercase mb-4 px-2 text-gray-500 font-bold tracking-widest flex justify-between">
            <span>REGISTRO HISTÓRICO</span>
            <span id="recordCount" class="text-cyan-500">0 DÍAS</span>
        </h3>
        <div id="historyList" class="space-y-3">
            <!-- JS Inject -->
        </div>
    </section>

    <!-- Footer Acciones -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-black/90 backdrop-blur-lg flex gap-4 max-w-md mx-auto border-t border-gray-900">
        <button onclick="exportCSV()" class="flex-1 h-12 rounded-xl border border-gray-800 text-[10px] font-bold text-gray-400 uppercase">
            Exportar CSV
        </button>
        <button onclick="showModal()" class="flex-1 h-12 rounded-xl border border-red-900/50 text-[10px] font-bold text-red-500 uppercase">
            Limpiar Todo
        </button>
    </div>

    <!-- Confirmación -->
    <div id="modal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-8 text-center">
        <div class="card border-red-500 w-full">
            <h2 class="font-cyber text-lg text-red-500 mb-2">BORRAR HISTORIAL</h2>
            <p class="text-gray-400 text-sm mb-6">¿Estás seguro? Perderás todos tus registros mensuales y semanales.</p>
            <div class="flex gap-4">
                <button onclick="hideModal()" class="flex-1 btn-quick bg-gray-800 rounded-xl text-xs">CANCELAR</button>
                <button onclick="clearData()" class="flex-1 btn-quick bg-red-600 rounded-xl text-xs">BORRAR</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('rider_v3_core')) || [];
        const fieldIds = ['baseEarnings', 'onlineTips', 'cashCollected', 'cashTips', 'gasExpense', 'regDate'];
        const ui = {};
        fieldIds.forEach(id => ui[id] = document.getElementById(id));

        // Formateadores
        const getWeekNumber = (d) => {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        };

        const formatDate = (str) => {
            const d = new Date(str + 'T12:00:00');
            const opt = { weekday: 'long', day: 'numeric', month: 'long' };
            const f = d.toLocaleDateString('es-AR', opt);
            return f.charAt(0).toUpperCase() + f.slice(1);
        };

        window.onload = () => {
            const now = new Date().toISOString().split('T')[0];
            ui.regDate.value = now;
            document.getElementById('headerDate').innerText = formatDate(now);
            
            fieldIds.forEach(id => ui[id].addEventListener('input', updateLiveStats));
            refreshUI();
        };

        function addQuick(id, val) {
            ui[id].value = (parseFloat(ui[id].value) || 0) + val;
            updateLiveStats();
        }

        function updateLiveStats() {
            const base = parseFloat(ui.baseEarnings.value) || 0;
            const online = parseFloat(ui.onlineTips.value) || 0;
            const collected = parseFloat(ui.cashCollected.value) || 0;
            const cashTips = parseFloat(ui.cashTips.value) || 0;
            const gas = parseFloat(ui.gasExpense.value) || 0;

            // Depósito: Lo que la empresa te debe menos lo que ya cobraste en mano
            const deposit = (base + online) - collected;
            
            // Ganancia Real: Lo que generaste + propinas - gastos - 10% mantenimiento
            const totalEarnings = base + online + cashTips;
            const maintenance = totalEarnings * 0.10;
            const net = totalEarnings - gas - maintenance;

            document.getElementById('bankDeposit').innerText = `$${Math.round(deposit).toLocaleString()}`;
            document.getElementById('liveNet').innerText = `$${Math.round(net).toLocaleString()}`;

            return { base, online, collected, cashTips, gas, maintenance, deposit, net: Math.round(net) };
        }

        function saveRecord() {
            const stats = updateLiveStats();
            if (stats.base === 0 && stats.online === 0 && stats.cashTips === 0) return;

            const dateVal = ui.regDate.value;
            const d = new Date(dateVal + 'T12:00:00');
            
            const entry = {
                id: Date.now(),
                date: dateVal,
                label: formatDate(dateVal),
                week: getWeekNumber(d),
                month: d.getMonth(),
                year: d.getFullYear(),
                ...stats
            };

            db.unshift(entry);
            db.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('rider_v3_core', JSON.stringify(db));

            // Reset
            ['baseEarnings', 'onlineTips', 'cashCollected', 'cashTips', 'gasExpense'].forEach(k => ui[k].value = '');
            updateLiveStats();
            refreshUI();
        }

        function refreshUI() {
            renderHistory();
            calculateAggregates();
            document.getElementById('recordCount').innerText = `${db.length} DÍAS`;
        }

        function calculateAggregates() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            const currentWeek = getWeekNumber(now);

            const monthly = db
                .filter(i => i.month === currentMonth && i.year === currentYear)
                .reduce((acc, curr) => acc + curr.net, 0);

            const weekly = db
                .filter(i => i.week === currentWeek && i.year === currentYear)
                .reduce((acc, curr) => acc + curr.net, 0);

            document.getElementById('monthlyTotal').innerText = `$${monthly.toLocaleString()}`;
            document.getElementById('weeklyTotal').innerText = `$${weekly.toLocaleString()}`;
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            db.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item card p-4 flex justify-between items-center';
                div.innerHTML = `
                    <div class="space-y-1">
                        <p class="text-[10px] text-gray-500 uppercase font-bold">${item.label}</p>
                        <p class="font-cyber text-green-400 text-lg">$${item.net.toLocaleString()} <span class="text-[9px] text-gray-500 font-normal">NETO</span></p>
                        <p class="text-[9px] ${item.deposit >= 0 ? 'text-cyan-500' : 'text-orange-500'} font-bold">DEPÓSITO: $${Math.round(item.deposit).toLocaleString()}</p>
                    </div>
                    <div class="text-right space-y-1">
                        <div class="text-[9px] text-gray-500">Cobrado Efec: $${item.collected.toLocaleString()}</div>
                        <div class="text-[9px] text-red-500">Nafta: -$${item.gas.toLocaleString()}</div>
                        <div class="text-[9px] text-gray-600">Mantenim: -$${Math.round(item.maintenance).toLocaleString()}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function exportCSV() {
            if (db.length === 0) return;
            let csv = "Fecha,Dia,Base,Propina_App,Cobrado_Efectivo,Propina_Efectivo,Nafta,Neto_Real,Deposito_Banco\n";
            db.forEach(i => {
                csv += `${i.date},${i.label.replace(',', '')},${i.base},${i.online},${i.collected},${i.cashTips},${i.gas},${i.net},${i.deposit}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `finanzas_rider_full.csv`;
            a.click();
        }

        function showModal() { document.getElementById('modal').classList.remove('hidden'); }
        function hideModal() { document.getElementById('modal').classList.add('hidden'); }
        function clearData() {
            db = [];
            localStorage.removeItem('rider_v3_core');
            refreshUI();
            hideModal();
        }
    </script>
</body>
</html>
