<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cydonia Finance</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #F8FAF9; margin: 0; touch-action: manipulation; }
        .num-font { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDtmxXb4wdkelAGeISytgj5JqQ3BGZvpzM",
            authDomain: "billetera-personal-d4ca9.firebaseapp.com",
            projectId: "billetera-personal-d4ca9",
            storageBucket: "billetera-personal-d4ca9.firebasestorage.app",
            messagingSenderId: "762760084018",
            appId: "1:762760084018:web:de9213b7defd8e1dc11a2b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [accounts, setAccounts] = useState([]);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const path = `usuarios/${user.uid}`;
                const unsubAcc = db.collection(`${path}/cuentas`).onSnapshot(
                    s => setAccounts(s.docs.map(d => ({id: d.id, ...d.data()}))),
                    e => console.error("Error leyendo cuentas:", e)
                );
                return () => unsubAcc();
            }, [user]);

            const addAccount = async () => {
                if (!user) return alert("Error: Usuario no autenticado.");
                const name = prompt("Nombre de la cuenta (ej: Mercado Pago, Efectivo):");
                if (!name) return;
                const balance = prompt("Saldo inicial ($):", "0");
                if (balance === null) return;

                try {
                    await db.collection(`usuarios/${user.uid}/cuentas`).add({
                        name: name,
                        balance: Number(balance || 0),
                        currency: 'ARS'
                    });
                } catch (err) {
                    alert("Error al guardar: " + err.message);
                }
            };

            const deleteAccount = async (id) => {
                if (!user) return;
                if (confirm("¿Borrar esta cuenta?")) {
                    await db.collection(`usuarios/${user.uid}/cuentas`).doc(id).delete();
                }
            };

            if (loading) return (
                <div className="h-screen flex items-center justify-center font-bold text-slate-500">
                    Cargando Cydonia Finance...
                </div>
            );

            if (!user) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 p-6">
                    <h1 className="text-white text-3xl font-black mb-6 tracking-widest">CYDONIA</h1>
                    <button onClick={() => auth.signInWithPopup(provider)} className="bg-emerald-500 text-slate-900 px-8 py-4 rounded-full font-black uppercase tracking-wider text-sm shadow-xl active:scale-95 transition-all">
                        Ingresar con Google
                    </button>
                </div>
            );

            const totalARS = accounts.reduce((acc, curr) => acc + Number(curr.balance || 0), 0);

            return (
                <div className="min-h-screen pb-24 bg-slate-100">
                    <header className="bg-emerald-800 pt-12 pb-20 px-6 rounded-b-[3rem] text-white shadow-lg">
                        <div className="flex justify-between items-center mb-6 max-w-md mx-auto">
                            <h1 className="font-black italic uppercase tracking-wider text-xl">Cydonia Finance</h1>
                            <button onClick={() => auth.signOut()} className="bg-white/10 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest">Salir</button>
                        </div>
                        <div className="max-w-md mx-auto">
                            <p className="text-white/60 text-[10px] font-black uppercase tracking-widest mb-1">Balance Total</p>
                            <h2 className="text-4xl font-black tracking-tight num-font">${totalARS.toLocaleString('es-AR')}</h2>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto px-6 -mt-8 space-y-6">
                        <button onClick={addAccount} className="w-full bg-emerald-500 text-slate-900 py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-md active:scale-95 transition-all">
                            + Agregar Cuenta
                        </button>

                        <div className="space-y-3">
                            <h3 className="font-black text-slate-400 uppercase tracking-widest text-[11px] px-2">Tus Cuentas</h3>
                            {accounts.map(acc => (
                                <div key={acc.id} className="bg-white p-5 rounded-2xl shadow-sm flex items-center justify-between">
                                    <div>
                                        <p className="font-black text-slate-800 text-base">{acc.name}</p>
                                        <span className="text-[9px] font-black uppercase bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded">Pesos</span>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <p className="font-black text-slate-900 text-lg num-font">${Number(acc.balance || 0).toLocaleString('es-AR')}</p>
                                        <button onClick={() => deleteAccount(acc.id)} className="text-slate-300 hover:text-rose-500 font-black text-lg px-2">×</button>
                                    </div>
                                </div>
                            ))}
                            {accounts.length === 0 && (
                                <div className="text-center p-8 bg-white rounded-2xl text-slate-400 font-bold text-sm shadow-sm">
                                    No tenés cuentas creadas todavía. Tocá el botón verde para empezar.
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
