<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Financiero</title>
    
    <script>
        window.onerror = function(message, source, lineno) {
            console.error(message);
            return true;
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0E14; color: #fff; margin: 0; touch-action: manipulation; overflow-x: hidden; padding-bottom: 90px; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .num-font { font-variant-numeric: tabular-nums; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top-color: #00FFCC; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDGUD-PIo2zFBkiFqfkN0Fpaqqp5_jNInw",
            authDomain: "control-financiero-rider.firebaseapp.com",
            projectId: "control-financiero-rider",
            storageBucket: "control-financiero-rider.firebasestorage.app",
            messagingSenderId: "952661224242",
            appId: "1:952661224242:web:3640495af6d4719c33052b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        const Icons = {
            Home: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            History: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 3v5h5M16 13H8M16 17H8M10 9H8"/></svg>,
            Wallet: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>,
            Camera: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
            Trash: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>,
            Edit: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authChecking, setAuthChecking] = useState(true);
            const [tab, setTab] = useState('registro');
            const [turnos, setTurnos] = useState([]);
            const [configCorte, setConfigCorte] = useState({ dia: 2, hora: "16:00" }); 
            const [usaHoraTurno, setUsaHoraTurno] = useState(false); // Por defecto apagado (23:59)
            const [ocrLoading, setOcrLoading] = useState(false);
            
            const [expandedMonth, setExpandedMonth] = useState(null);
            const [expandedWeek, setExpandedWeek] = useState(null);
            
            const [formData, setFormData] = useState({ 
                base: '', propinaOnline: '', logros: '', bonos: '', adelantosEfectivo: '', nafta: '', fechaRegistro: '', horaRegistro: ''
            });

            // Setear la fecha y hora local correcta al iniciar
            useEffect(() => {
                const today = new Date();
                const defaultDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                const defaultTime = `${String(today.getHours()).padStart(2, '0')}:${String(today.getMinutes()).padStart(2, '0')}`;
                setFormData(prev => ({ ...prev, fechaRegistro: defaultDate, horaRegistro: defaultTime }));
            }, []);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => { 
                    setUser(u); 
                    setAuthChecking(false); 
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return; 
                const unsub = db.collection(`usuarios/${user.uid}/turnos`).orderBy('timestamp', 'desc').onSnapshot(s => {
                    setTurnos(s.docs.map(d => ({id: d.id, ...d.data()})));
                }, e => console.error(e));
                
                const unsubConfig = db.collection(`usuarios/${user.uid}/config`).doc('corte').onSnapshot(d => {
                    if (d.exists) setConfigCorte(d.data()); 
                }, e => console.error(e));
                
                return () => { unsub(); unsubConfig(); };
            }, [user]);

            const handleOCR = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setOcrLoading(true);
                try {
                    const result = await Tesseract.recognize(file, 'spa');
                    const text = result.data.text.toLowerCase();
                    
                    const extractNum = (keyword) => {
                        const regex = new RegExp(`${keyword}[^0-9]*([0-9.,]+)`, 'i');
                        const match = text.match(regex);
                        if (match) {
                            let numStr = match[1];
                            let integerPart = numStr.split('.')[0]; 
                            return integerPart.replace(/[^0-9]/g, ''); 
                        }
                        return '';
                    };

                    const extractDate = (textString) => {
                        const dateRegex = /(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/;
                        const match = textString.match(dateRegex);
                        if (match) {
                            const day = match[1].padStart(2, '0');
                            const month = match[2].padStart(2, '0');
                            const year = match[3] ? (match[3].length === 2 ? '20'+match[3] : match[3]) : new Date().getFullYear();
                            return `${year}-${month}-${day}`;
                        }
                        return null;
                    };

                    const foundDate = extractDate(text);

                    setFormData(prev => ({
                        ...prev,
                        base: extractNum('base') || prev.base,
                        propinaOnline: extractNum('propina') || prev.propinaOnline,
                        logros: extractNum('logro') || prev.logros,
                        bonos: extractNum('bono') || prev.bonos,
                        fechaRegistro: foundDate || prev.fechaRegistro
                    }));
                    alert("¡Escaneo completo! Revisá los montos extraídos.");
                } catch (error) {
                    alert("Hubo un error al leer la imagen.");
                }
                setOcrLoading(false);
            };

            const guardarTurno = async (e) => {
                e.preventDefault();
                if (!user) return;
                
                const d = formData;
                const [year, month, day] = d.fechaRegistro.split('-');
                
                // Si el switch está prendido usa la hora del input, si no, asume 23:59
                const [h, m] = usaHoraTurno ? (d.horaRegistro || "12:00").split(':') : ["23", "59"];
                const horaAguardar = usaHoraTurno ? d.horaRegistro : "23:59";
                
                const dateObj = new Date(year, month - 1, day, h, m, 0); 
                const fechaFormat = dateObj.toLocaleDateString('es-AR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                const payload = {
                    base: Number(d.base||0), propinaOnline: Number(d.propinaOnline||0),
                    logros: Number(d.logros||0), bonos: Number(d.bonos||0),
                    adelantosEfectivo: Number(d.adelantosEfectivo||0), nafta: Number(d.nafta||0),
                    fecha: fechaFormat, horaStr: horaAguardar, timestamp: dateObj.getTime()
                };
                
                await db.collection(`usuarios/${user.uid}/turnos`).add(payload);
                
                const today = new Date();
                const defaultDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                const defaultTime = `${String(today.getHours()).padStart(2, '0')}:${String(today.getMinutes()).padStart(2, '0')}`;
                
                setFormData(prev => ({ 
                    base: '', propinaOnline: '', logros: '', bonos: '', adelantosEfectivo: '', nafta: '', fechaRegistro: defaultDate, horaRegistro: defaultTime
                }));
                setUsaHoraTurno(false); // Resetea el switch
                alert("Jornada Guardada con Éxito");
            };

            const editarTurno = async (t) => {
                const nuevaBase = prompt("Base App $:", t.base);
                if (nuevaBase === null) return;
                const nuevaPropina = prompt("Propinas Online $:", t.propinaOnline || 0);
                if (nuevaPropina === null) return;
                const nuevosLogros = prompt("Logros $:", t.logros || 0);
                if (nuevosLogros === null) return;
                const nuevosBonos = prompt("Bonos $:", t.bonos || 0);
                if (nuevosBonos === null) return;
                const nuevosAdelantos = prompt("Adelantos en Efectivo $:", t.adelantosEfectivo || 0);
                if (nuevosAdelantos === null) return;
                const nuevaNafta = prompt("Nafta $:", t.nafta || 0);
                if (nuevaNafta === null) return;

                await db.collection(`usuarios/${user.uid}/turnos`).doc(t.id).update({
                    base: Number(nuevaBase),
                    propinaOnline: Number(nuevaPropina),
                    logros: Number(nuevosLogros),
                    bonos: Number(nuevosBonos),
                    adelantosEfectivo: Number(nuevosAdelantos),
                    nafta: Number(nuevaNafta)
                });
            };

            const calcularCobros = useMemo(() => {
                const now = new Date();
                const currentDay = now.getDay(); 
                let lastCutoff = new Date(now);
                let daysSinceCutoff = currentDay >= configCorte.dia ? currentDay - configCorte.dia : 7 - (configCorte.dia - currentDay);
                
                lastCutoff.setDate(now.getDate() - daysSinceCutoff);
                
                // Siempre usa la hora configurada (ya no se puede apagar)
                const [h, m] = (configCorte.hora || "16:00").split(':');
                lastCutoff.setHours(h, m, 0, 0);

                if (now < lastCutoff) lastCutoff.setDate(lastCutoff.getDate() - 7);

                const turnosPeriodo = turnos.filter(t => t.timestamp >= lastCutoff.getTime());

                let sumBase = 0, sumPropOnline = 0, sumEfectivo = 0, sumLogros = 0;
                turnosPeriodo.forEach(t => {
                    sumBase += (t.base || 0); sumPropOnline += (t.propinaOnline || 0);
                    sumLogros += ((t.logros || 0) + (t.bonos || 0)); 
                    sumEfectivo += (t.adelantosEfectivo || 0); 
                });

                const transfPropinas = sumPropOnline;
                const transfSueldo = (sumBase + sumLogros) - sumEfectivo;

                const pastTurnos = turnos.filter(t => t.timestamp < lastCutoff.getTime());
                const pastLiquidaciones = [];

                if (pastTurnos.length > 0) {
                    let currentBucketEnd = new Date(lastCutoff);
                    let currentBucketStart = new Date(lastCutoff);
                    currentBucketStart.setDate(currentBucketStart.getDate() - 7);
                    let currentLiq = null;

                    pastTurnos.forEach(t => {
                        while (t.timestamp < currentBucketStart.getTime()) {
                            if (currentLiq) {
                                pastLiquidaciones.push(currentLiq);
                                currentLiq = null;
                            }
                            currentBucketEnd = new Date(currentBucketStart);
                            currentBucketStart.setDate(currentBucketStart.getDate() - 7);
                        }

                        if (!currentLiq) {
                            currentLiq = {
                                label: `Corte ${currentBucketEnd.toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit' })}`,
                                propinas: 0,
                                pagos: 0,
                                adelantos: 0
                            };
                        }

                        currentLiq.pagos += (t.base || 0) + (t.logros || 0) + (t.bonos || 0);
                        currentLiq.propinas += (t.propinaOnline || 0);
                        currentLiq.adelantos += (t.adelantosEfectivo || 0);
                    });
                    if (currentLiq) pastLiquidaciones.push(currentLiq);
                }

                return { transfPropinas, transfSueldo, lastCutoff, pastLiquidaciones };
            }, [turnos, configCorte]);

            const groupedHistorial = useMemo(() => {
                const groups = {};
                turnos.forEach(t => {
                    const d = new Date(t.timestamp);
                    const monthYear = d.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });

                    const day = d.getDay();
                    const diffToMonday = day === 0 ? -6 : 1 - day;
                    const monday = new Date(d);
                    monday.setDate(d.getDate() + diffToMonday);
                    const sunday = new Date(monday);
                    sunday.setDate(monday.getDate() + 6);
                    const weekStr = `Semana del ${monday.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'})} al ${sunday.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'})}`;

                    if(!groups[monthYear]) groups[monthYear] = { totalNeto: 0, weeks: {} };
                    if(!groups[monthYear].weeks[weekStr]) groups[monthYear].weeks[weekStr] = { totalNeto: 0, days: [] };

                    const neto = (t.base + (t.propinaOnline||0) + (t.logros||0) + (t.bonos||0)) - (t.nafta||0);
                    
                    groups[monthYear].totalNeto += neto;
                    groups[monthYear].weeks[weekStr].totalNeto += neto;
                    groups[monthYear].weeks[weekStr].days.push(t);
                });
                return groups;
            }, [turnos]);

            if (authChecking) return <div className="h-screen flex items-center justify-center bg-[#0B0E14]"><div className="loader"></div></div>;

            if (!user) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-black relative">
                    <div className="absolute inset-0 bg-gradient-to-br from-cyan-900/20 to-black z-0"></div>
                    <div className="relative z-10 w-full max-w-sm glass p-8 rounded-3xl text-center">
                        <h1 className="text-3xl font-black italic uppercase tracking-widest neon-text text-cyan-400 mb-8">CONTROL FINANCIERO</h1>
                        <button onClick={() => auth.signInWithPopup(provider)} className="w-full bg-cyan-500 hover:bg-cyan-400 text-black py-4 rounded-xl font-black uppercase tracking-widest transition-all">Ingresar con Google</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto">
                    <header className="glass sticky top-0 z-50 p-6 rounded-b-3xl mb-6 bg-black/80">
                        <div className="flex justify-between items-center">
                            <div>
                                <p className="text-[10px] uppercase tracking-widest text-gray-400">Rider ID: {user.displayName}</p>
                                <h2 className="text-2xl font-black italic text-cyan-400 uppercase">Control Financiero</h2>
                            </div>
                            <button onClick={() => { auth.signOut(); localStorage.clear(); window.location.reload(); }} className="text-[10px] uppercase font-bold text-rose-400 border border-rose-400/30 px-3 py-1 rounded-full">Salir</button>
                        </div>
                    </header>

                    <main className="px-6 space-y-6">
                        {/* PESTAÑA REGISTRO */}
                        {tab === 'registro' && (
                            <div className="animate-in fade-in space-y-6">
                                <div className="glass p-6 rounded-3xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl"></div>
                                    <h3 className="font-black text-lg mb-4 text-cyan-300">NUEVA JORNADA</h3>
                                    
                                    <label className="flex items-center justify-center gap-2 w-full glass bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 p-4 rounded-2xl mb-6 cursor-pointer transition-all border border-cyan-500/30 font-bold text-sm">
                                        {ocrLoading ? <div className="loader"></div> : <><Icons.Camera /> Escanear Resumen (IA)</>}
                                        <input type="file" accept="image/*" onChange={handleOCR} className="hidden" />
                                    </label>

                                    <form onSubmit={guardarTurno} className="space-y-4 relative z-10">
                                        
                                        <div className="grid grid-cols-2 gap-4 mb-4">
                                            <div>
                                                <label className="text-[10px] uppercase text-gray-400 font-bold ml-2 mb-1 block">Fecha del Turno</label>
                                                <input type="date" required value={formData.fechaRegistro} onChange={e=>setFormData({...formData, fechaRegistro: e.target.value})} className="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl font-bold text-sm text-gray-300 outline-none focus:border-cyan-500 mt-1" />
                                            </div>
                                            <div>
                                                {/* SWITCH PARA HORA DE TURNO */}
                                                <div className="flex items-center justify-between ml-2 mb-1">
                                                    <label className="text-[10px] uppercase text-gray-400 font-bold">Hora exacta</label>
                                                    <label className="relative inline-flex items-center cursor-pointer">
                                                        <input type="checkbox" checked={usaHoraTurno} onChange={e => setUsaHoraTurno(e.target.checked)} className="sr-only peer" />
                                                        <div className="w-7 h-4 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-cyan-500"></div>
                                                    </label>
                                                </div>
                                                {usaHoraTurno ? (
                                                    <input type="time" required value={formData.horaRegistro} onChange={e=>setFormData({...formData, horaRegistro: e.target.value})} className="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl font-bold text-sm text-gray-300 outline-none focus:border-cyan-500 mt-1" />
                                                ) : (
                                                    <div className="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl font-bold text-sm text-gray-500 mt-1 flex items-center justify-center">23:59 hs</div>
                                                )}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] uppercase text-gray-400 font-bold ml-2">Base App $</label><input type="number" value={formData.base} onChange={e=>setFormData({...formData, base: e.target.value})} className="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl font-black text-xl outline-none focus:border-cyan-500" /></div>
                                            <div><label className="text-[10px] uppercase text-gray-400 font-bold ml-2">Propinas Online $</label><input type="number" value={formData.propinaOnline} onChange={e=>setFormData({...formData, propinaOnline: e.target.value})} className="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl font-black text-xl outline-none focus:border-cyan-500" /></div>
                                            <div><label className="text-[10px] uppercase text-gray-400 font-bold ml-2">Logros $</label><input type="number" value={formData.logros} onChange={e=>setFormData({...formData, logros: e.target.value})} className="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl font-black text-xl outline-none focus:border-cyan-500" /></div>
                                            <div><label className="text-[10px] uppercase text-gray-400 font-bold ml-2">Bonos $</label><input type="number" value={formData.bonos} onChange={e=>setFormData({...formData, bonos: e.target.value})} className="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl font-black text-xl outline-none focus:border-cyan-500" /></div>
                                        </div>

                                        <div className="pt-4 border-t border-gray-800">
                                            <label className="text-[10px] uppercase text-emerald-400 font-bold ml-2">Adelantos en Efectivo $</label>
                                            <input type="number" value={formData.adelantosEfectivo} onChange={e=>setFormData({...formData, adelantosEfectivo: e.target.value})} className="w-full bg-emerald-900/20 border border-emerald-900/50 p-4 rounded-2xl font-black text-xl text-emerald-400 outline-none focus:border-emerald-500 mt-1" />
                                        </div>

                                        <div className="pt-2">
                                            <label className="text-[10px] uppercase text-rose-400 font-bold ml-2">Gasto de Nafta $</label>
                                            <input type="number" value={formData.nafta} onChange={e=>setFormData({...formData, nafta: e.target.value})} className="w-full bg-rose-900/20 border border-rose-900/50 p-4 rounded-2xl font-black text-xl text-rose-400 outline-none focus:border-rose-500 mt-1" />
                                        </div>

                                        <button className="w-full bg-cyan-500 text-black py-5 rounded-2xl font-black uppercase tracking-widest mt-6 shadow-[0_0_20px_rgba(0,255,204,0.3)]">Guardar Jornada</button>
                                    </form>
                                </div>

                                {/* CONFIGURACIÓN DE CORTE FIJO */}
                                <div className="glass p-6 rounded-3xl border border-amber-900/30 bg-black/40">
                                    <h3 className="font-black text-xs mb-4 text-amber-400 uppercase">Configuración Corte Semanal (PeYa)</h3>
                                    <p className="text-[10px] text-gray-400 mb-4">Elegí qué día y a qué hora exacta hace el corte la App para calcular el próximo cobro.</p>
                                    <div className="grid grid-cols-2 gap-4">
                                        <select value={configCorte.dia} onChange={e => {
                                            const n = { ...configCorte, dia: Number(e.target.value) };
                                            setConfigCorte(n); 
                                            if (user) db.collection(`usuarios/${user.uid}/config`).doc('corte').set(n);
                                        }} className="bg-black/50 border border-gray-800 p-4 rounded-xl font-bold text-sm outline-none text-white appearance-none">
                                            <option value={1}>Lunes</option><option value={2}>Martes</option><option value={3}>Miércoles</option><option value={4}>Jueves</option><option value={5}>Viernes</option><option value={6}>Sábado</option><option value={0}>Domingo</option>
                                        </select>
                                        <input type="time" value={configCorte.hora || "16:00"} onChange={e => {
                                            const n = { ...configCorte, hora: e.target.value };
                                            setConfigCorte(n); 
                                            if (user) db.collection(`usuarios/${user.uid}/config`).doc('corte').set(n);
                                        }} className="w-full bg-black/50 border border-gray-800 p-4 rounded-xl font-bold text-sm outline-none text-white" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA COBROS */}
                        {tab === 'cobros' && (
                            <div className="animate-in fade-in space-y-6">
                                <div className="glass p-6 rounded-3xl bg-cyan-900/10 border-cyan-900/30">
                                    <h3 className="font-black text-lg mb-2 text-cyan-300 uppercase italic">Liquidación en Curso</h3>
                                    <p className="text-xs text-gray-400 mb-6">Desde el último corte: {calcularCobros.lastCutoff.toLocaleDateString('es-AR')} a las {configCorte.hora} hs</p>
                                    
                                    <div className="space-y-4">
                                        <div className="glass p-4 rounded-2xl border-emerald-900/50">
                                            <p className="text-[10px] uppercase font-bold text-gray-400 mb-1">Transferencia 1: Propinas Online</p>
                                            <p className="text-3xl font-black text-emerald-400">${calcularCobros.transfPropinas.toLocaleString()}</p>
                                        </div>
                                        <div className="glass p-4 rounded-2xl border-amber-900/50">
                                            <p className="text-[10px] uppercase font-bold text-gray-400 mb-1">Transferencia 2: Sueldo Base (App - Adelantos)</p>
                                            <p className={`text-3xl font-black ${calcularCobros.transfSueldo >= 0 ? 'text-amber-400' : 'text-rose-500'}`}>
                                                ${calcularCobros.transfSueldo.toLocaleString()}
                                            </p>
                                            {calcularCobros.transfSueldo < 0 && <p className="text-xs text-rose-400 mt-2 font-bold">¡Ojo! Tenés deuda. Te van a descontar de las propinas.</p>}
                                        </div>
                                    </div>
                                </div>

                                {/* HISTORIAL DE LIQUIDACIONES */}
                                <div className="glass p-6 rounded-3xl bg-black/40">
                                    <h3 className="font-black text-sm mb-4 text-emerald-400 uppercase italic">Historial de Liquidaciones</h3>
                                    {calcularCobros.pastLiquidaciones.length === 0 ? (
                                        <p className="text-center text-gray-500 text-xs">No hay cortes anteriores registrados.</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {calcularCobros.pastLiquidaciones.map((liq, idx) => (
                                                <div key={idx} className="bg-black/60 p-4 rounded-xl border border-gray-800">
                                                    <div className="flex justify-between items-center mb-2 border-b border-gray-800 pb-2">
                                                        <span className="font-black text-xs text-white uppercase">{liq.label}</span>
                                                    </div>
                                                    <div className="grid grid-cols-1 gap-2 text-[10px] uppercase font-bold text-gray-400">
                                                        <div className="flex justify-between"><span>Pagos App (Base+Bonos):</span> <span className="text-white">${liq.pagos.toLocaleString()}</span></div>
                                                        <div className="flex justify-between"><span>Efectivo Retenido (Adelantos):</span> <span className="text-rose-400">-${liq.adelantos.toLocaleString()}</span></div>
                                                        <div className="flex justify-between border-t border-gray-800 pt-1"><span>Liquidación Sueldo:</span> <span className={liq.pagos - liq.adelantos >= 0 ? "text-amber-400" : "text-rose-500"}>${(liq.pagos - liq.adelantos).toLocaleString()}</span></div>
                                                        <div className="flex justify-between mt-1"><span>Liquidación Propinas:</span> <span className="text-emerald-400">${liq.propinas.toLocaleString()}</span></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA HISTORIAL */}
                        {tab === 'historial' && (
                            <div className="animate-in fade-in space-y-4">
                                <h3 className="font-black text-lg mb-4 text-cyan-300 uppercase italic">Historial y Balances</h3>
                                {Object.keys(groupedHistorial).length === 0 ? <p className="text-center text-gray-500 p-6">No hay registros aún.</p> : 
                                    Object.entries(groupedHistorial).map(([month, monthData]) => (
                                        <div key={month} className="mb-4">
                                            <button onClick={() => setExpandedMonth(expandedMonth === month ? null : month)} className="w-full glass p-4 rounded-2xl flex justify-between items-center text-cyan-300 font-black uppercase transition-all">
                                                <span>{month}</span>
                                                <span>${monthData.totalNeto.toLocaleString()}</span>
                                            </button>
                                            {expandedMonth === month && (
                                                <div className="pl-4 mt-3 space-y-3">
                                                    {Object.entries(monthData.weeks).map(([week, weekData]) => (
                                                        <div key={week}>
                                                            <button onClick={() => setExpandedWeek(expandedWeek === week ? null : week)} className="w-full bg-cyan-900/20 p-3 rounded-xl flex justify-between items-center text-gray-300 font-bold text-xs uppercase border border-cyan-900/50">
                                                                <span>{week}</span>
                                                                <span className="text-cyan-400">${weekData.totalNeto.toLocaleString()}</span>
                                                            </button>
                                                            {expandedWeek === week && (
                                                                <div className="mt-2 space-y-2">
                                                                    {weekData.days.map(t => {
                                                                        const neto = (t.base + (t.propinaOnline||0) + (t.logros||0) + (t.bonos||0)) - (t.nafta||0);
                                                                        return (
                                                                            <div key={t.id} className="glass p-4 rounded-2xl flex justify-between items-center bg-black/60">
                                                                                <div>
                                                                                    <p className="font-black text-xs capitalize text-white">{t.fecha} {t.horaStr && `- ${t.horaStr}hs`}</p>
                                                                                    <p className="text-[9px] text-gray-400 font-bold mt-1 uppercase">
                                                                                        App: ${(t.base+(t.logros||0)+(t.bonos||0)).toLocaleString()} | Prop: ${t.propinaOnline} | Adel: ${t.adelantosEfectivo} | Nafta: ${t.nafta}
                                                                                    </p>
                                                                                </div>
                                                                                <div className="text-right flex items-center gap-2">
                                                                                    <div className="mr-2">
                                                                                        <p className="text-[9px] text-cyan-500 font-black uppercase">Neto</p>
                                                                                        <p className="font-black text-sm">${neto.toLocaleString()}</p>
                                                                                    </div>
                                                                                    <button onClick={() => editarTurno(t)} className="text-gray-400 hover:text-amber-400 p-2"><Icons.Edit /></button>
                                                                                    <button onClick={() => { if(window.confirm('¿Borrar jornada?')) db.collection(`usuarios/${user.uid}/turnos`).doc(t.id).delete(); }} className="text-gray-600 hover:text-rose-500 p-2"><Icons.Trash /></button>
                                                                                </div>
                                                                            </div>
                                                                        )
                                                                    })}
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))
                                }
                            </div>
                        )}
                    </main>

                    {/* NAVEGACIÓN INFERIOR */}
                    <nav className="fixed bottom-0 w-full glass bg-black/90 pb-safe pt-2 px-6 rounded-t-3xl border-t border-white/5 z-50">
                        <div className="flex justify-between items-center max-w-md mx-auto py-3">
                            <button onClick={() => setTab('registro')} className={`flex flex-col items-center gap-1 transition-all ${tab==='registro' ? 'text-cyan-400 scale-110' : 'text-gray-500'}`}><Icons.Home /><span className="text-[9px] font-black uppercase">Registro</span></button>
                            <button onClick={() => setTab('cobros')} className={`flex flex-col items-center gap-1 transition-all ${tab==='cobros' ? 'text-cyan-400 scale-110' : 'text-gray-500'}`}><Icons.Wallet /><span className="text-[9px] font-black uppercase">Cobros</span></button>
                            <button onClick={() => setTab('historial')} className={`flex flex-col items-center gap-1 transition-all ${tab==='historial' ? 'text-cyan-400 scale-110' : 'text-gray-500'}`}><Icons.History /><span className="text-[9px] font-black uppercase">Historial</span></button>
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
